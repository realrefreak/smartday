# CI/CD: GitHub runs these checks on its own machines every time code is
# pushed or a pull request is opened. A red ❌ means "don't merge / don't
# deploy this yet". On pushes to main, a passing run then deploys to production.
# On pull requests, a passing run deploys a preview with its own database.
#
# Structure: a workflow has jobs; a job runs on a fresh virtual machine and
# executes its steps in order. If any step fails, the job stops and fails.
#
#   checks ──(passed, push to main)──────> deploy           (production)
#   checks ──(passed, pull request)──────> preview          (preview URL + preview database)
#   pull request closed or merged ───────> preview-cleanup  (deletes the preview database)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The defaults, plus "closed" so we can clean up the preview database.
    types: [opened, synchronize, reopened, closed]

# Only one run at a time. All runs share the same test database, and the
# database tests delete every task in it, so two overlapping runs could break
# each other. It also means two deploys can never migrate production at once.
# Newer runs wait in line.
concurrency:
  group: ci-test-database
  cancel-in-progress: false

# The workflow only needs to read the code, nothing else.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, E2E tests
    # Nothing to test when a pull request is closed; only cleanup runs then.
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Comes from Settings -> Secrets and variables -> Actions in GitHub.
      # Never written in this file: anyone who can read the repo can read this file.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          # Reuse downloaded packages between runs (faster installs).
          cache: npm

      # `npm ci` installs exactly what package-lock.json says. Unlike
      # `npm install`, it never changes the lock file, so CI tests the same
      # versions you tested locally.
      - name: Install dependencies
        run: npm ci

      # Without the test database, the database tests would be quietly skipped
      # and CI would look green while testing less. Fail loudly instead.
      - name: Check the test database secret is set
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::TEST_DATABASE_URL secret is missing. Add it in the repo's Actions secrets."
            exit 1
          fi

      # Fastest checks first, so obvious mistakes fail within seconds.
      - name: Lint
        run: npm run lint

      - name: Unit and database tests (Vitest)
        run: npm run test:run

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      # A throwaway secret for signing session cookies, made fresh for every
      # run. The test app only lives for a few minutes, so nothing needs to
      # stay signed in afterwards, and there is no real secret to leak.
      - name: Create a one-off auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      # If E2E tests fail, keep the traces so you can download and replay them:
      #   npx playwright show-trace trace.zip
      - name: Save Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # CD ("continuous deployment"): ship to production, but only if every check
  # above passed. Vercel's own auto-deploy of main is turned off in vercel.json,
  # so this job is the only way code reaches the live site.
  deploy:
    name: Migrate database and deploy to Vercel
    # Wait for the checks job, and skip this job entirely if it failed.
    needs: checks
    # Only real pushes to main go live. Pull requests stop after the checks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Secrets for this job live in the GitHub environment named "production"
    # (Settings -> Environments), not in the repo-wide secrets, so the checks
    # job and pull requests can never read them. GitHub also lists each deploy
    # on the repo page, with a link to the live site.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      # Which Vercel team and project to deploy to. Not secret: they're IDs, not
      # passwords. Stored as environment *variables* (vars), not secrets.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      # Lets the Vercel CLI act as you. Treat it like a password.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail with a clear message instead of a confusing error halfway through.
      - name: Check the production secrets are set
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          missing=0
          for name in PRODUCTION_DATABASE_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it to the 'production' environment in GitHub."
              missing=1
            fi
          done
          exit $missing

      # Database first, then code. The new code may need new tables or columns,
      # so they must exist before it goes live. Until the deploy below finishes,
      # the OLD code runs against the NEW database, which is why migrations
      # must only add things, never rename or delete what old code still uses.
      # Drizzle records applied migrations, so ones already run are skipped.
      - name: Migrate the production database
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run db:migrate

      # Pinned to an exact version, like package-lock.json does for the app,
      # so a new CLI release can't change how we deploy without us knowing.
      - name: Install the Vercel CLI
        run: npm install --global vercel@65.9.0

      # Download the project's settings and non-sensitive env vars from Vercel.
      # Sensitive values (DATABASE_URL, BETTER_AUTH_SECRET) stay on Vercel and
      # are given to the app when it runs, so they never touch this machine.
      - name: Get Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Build here on GitHub's machine, then upload the finished result.
      # The SENTRY_* values let the build upload source maps to Sentry, so
      # error stack traces point at our real files and line numbers. Without
      # them (e.g. before Sentry is set up) the build just skips that step.
      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed to $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Preview: every pull request gets its own live copy of the app, with its own
  # database, so a feature can be tried online before it reaches main.
  preview:
    name: Deploy a preview with its own database
    needs: checks
    # Only for pull requests from this repository (a fork's code must never
    # run with our secrets), and not when the pull request is being closed.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Separate GitHub environment from production: different secrets, and it
    # can't touch the production database. The URL appears on the pull request.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # One Neon branch per pull request, e.g. preview/pr-12.
      PREVIEW_BRANCH: preview/pr-${{ github.event.pull_request.number }}
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the preview secrets are set
        run: |
          missing=0
          for name in NEON_API_KEY NEON_PROJECT_ID VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing. Add it to the 'preview' environment in GitHub."
              missing=1
            fi
          done
          exit $missing

      # Pinned versions, like the app's own dependencies.
      - name: Install the Vercel and Neon CLIs
        run: npm install --global vercel@65.9.0 neonctl@8.8.0

      # First push of a pull request: copy the production branch. Later pushes
      # reuse the same database, so test data survives between pushes.
      - name: Create or reuse the preview database
        id: database
        run: |
          if neonctl branches get "$PREVIEW_BRANCH" --project-id "$NEON_PROJECT_ID" > /dev/null 2>&1; then
            echo "Reusing existing database branch $PREVIEW_BRANCH."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            # Output goes to /dev/null: it includes the password.
            neonctl branches create --project-id "$NEON_PROJECT_ID" \
              --name "$PREVIEW_BRANCH" --parent production > /dev/null
            echo "Created database branch $PREVIEW_BRANCH from production."
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

          url=$(neonctl connection-string "$PREVIEW_BRANCH" --project-id "$NEON_PROJECT_ID" --pooled)
          # Hide it in all later log output, then share it with later steps.
          echo "::add-mask::$url"
          echo "DATABASE_URL=$url" >> "$GITHUB_ENV"

      # A fresh copy of production contains real users: remove them.
      - name: Remove copied users from the new preview database
        if: steps.database.outputs.created == 'true'
        run: node scripts/wipe-preview-users.mjs

      # Same rule as production: database first, then code.
      - name: Migrate the preview database
        run: npm run db:migrate

      - name: Get Vercel project settings
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      # No --prod, so this is a preview deployment. --env gives this one
      # deployment its own database address, without storing it in Vercel's
      # settings (where it would apply to every preview).
      - name: Deploy the preview
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" --env DATABASE_URL="$DATABASE_URL")
          echo "Preview deployed to $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Once a pull request is merged or closed, its preview database is no longer
  # needed. Deleting it frees up Neon's branch limit (free plans allow only a
  # few). The preview URL itself stays in Vercel's history, but with no database
  # behind it.
  preview-cleanup:
    name: Delete the preview database
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      PREVIEW_BRANCH: preview/pr-${{ github.event.pull_request.number }}

    steps:
      - name: Delete the Neon branch
        run: |
          if npx --yes neonctl@8.8.0 branches get "$PREVIEW_BRANCH" --project-id "$NEON_PROJECT_ID" > /dev/null 2>&1; then
            npx --yes neonctl@8.8.0 branches delete "$PREVIEW_BRANCH" --project-id "$NEON_PROJECT_ID" > /dev/null
            echo "Deleted $PREVIEW_BRANCH."
          else
            echo "$PREVIEW_BRANCH doesn't exist (no preview was deployed). Nothing to do."
          fi
